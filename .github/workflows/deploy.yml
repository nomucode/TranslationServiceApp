name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/translation-api
  RESOURCE_GROUP: rg-translation-service
  CONTAINER_APP: translation-service-app

# Se limitan al mínimo: sólo leer el código y publicar paquetes.
permissions:
  contents: read
  packages: write

# Un despliegue a la vez. Sin esto, dos pushes seguidos a main podrían aplicar sus
# revisiones en orden invertido y dejar en producción la imagen más antigua.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Las versiones están centralizadas, así que basta con vigilar ese fichero.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TranslationService.slnx

      - name: Test
        # SkipTailwindBuild: los tests no necesitan CSS, así que el job no depende de npm.
        # Se excluyen los de humo, que llaman a Azure Translator real y necesitan credenciales.
        run: >
          dotnet test TranslationService.slnx
          --no-restore
          --filter "FullyQualifiedName!~Smoke"
          --logger "trx;LogFileName=test-results.trx"
          -p:SkipTailwindBuild=true

      - name: Upload test results
        # También cuando fallan: es justo entonces cuando hacen falta.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    # Puerta de calidad: sin tests en verde no se construye la imagen ni se despliega.
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El propietario del repositorio puede llevar mayúsculas, pero las referencias de
      # imagen de Docker deben ir en minúsculas o el push falla.
      - name: Resolve image reference
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:${{ github.sha }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Imagen: ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Container Apps sólo ejecuta linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/translation-api:latest
          # La caché de GitHub Actions evita reinstalar npm y rehacer el restore de NuGet
          # en cada ejecución.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container app revision
        id: deploy
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            az containerapp update \
              --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ needs.build.outputs.image }}" \
              --output none

            fqdn=$(az containerapp show \
              --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)

            echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      # Con minReplicas=0 la primera petición arranca la réplica desde cero, así que la
      # comprobación reintenta en lugar de fallar por un arranque en frío.
      - name: Verify deployment
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}/health"

          for attempt in $(seq 1 20); do
            if curl -fsS -m 20 "${url}" > /dev/null; then
              echo "✅ Despliegue verificado en ${url}"
              exit 0
            fi
            echo "Intento ${attempt}: todavía sin respuesta, reintentando..."
            sleep 15
          done

          echo "❌ La aplicación no respondió tras el despliegue."
          exit 1

      - name: Log out from Azure
        if: always()
        run: az logout || true
